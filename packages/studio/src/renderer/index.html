<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<!-- CSP：不给外部资源留口子（渲染进程只与 main 说话，不该有网络面）。
		     script-src 'self' 需要 Vite 产物是**外链脚本**而非内联——rollup 默认即如此；
		     若哪天引入需要内联 script 的插件，这条会立刻红，届时再评估是否放宽。 -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
		/>
		<title>tavern studio</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.tsx"></script>
	</body>
</html>
